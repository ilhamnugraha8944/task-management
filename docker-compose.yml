services:
  mysql:
    image: mysql:8.4
    container_name: task-management-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: task_management
      MYSQL_USER: task_user
      MYSQL_PASSWORD: task123
      MYSQL_ROOT_PASSWORD: taskroot123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: